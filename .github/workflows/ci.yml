# checks on every push and pull request; on a tag v<version>: build alice-analyser.skill and attach it to a release
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checks and build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then scripts/check.sh --tag "${GITHUB_REF#refs/tags/}"; else scripts/check.sh; fi
      - name: Keep the built skill
        uses: actions/upload-artifact@v4
        with:
          name: alice-analyser.skill
          path: dist/alice-analyser.skill
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(cat VERSION)"
          awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/alice-analyser.skill --title "alice-analyser $v" --notes-file notes.md
